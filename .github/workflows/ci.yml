name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same Node line as docker/Dockerfile's NODE_VERSION
  NODE_VERSION: 24.19.0

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  release:
    name: Release
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # DOCS_TOKEN is a personal access token, NOT the default GITHUB_TOKEN, and
      # that is load-bearing: a release published using GITHUB_TOKEN does not
      # trigger further workflow runs, so docker.yml would never fire and no
      # image would ever be built. Same reason the other repos carry their own
      # token. Scopes needed: repo (+ workflow if a workflow file ever changes
      # in a release commit).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.DOCS_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No release assets: the deployable is the Docker image built by
      # docker.yml on the published release.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.DOCS_TOKEN }}
        run: pnpm run semantic-release
