worker_processes auto;
error_log /dev/stderr error;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include               /etc/nginx/mime.types;
  default_type          application/octet-stream;

  # readOnlyRootFilesystem: every writable path lives under /tmp or
  # /var/cache/nginx, both emptyDir mounts in the Deployment.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout combined;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    autoindex off;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "healthy\n";
    }

    # Hashed build assets are immutable.
    location /assets/ {
      access_log off;
      expires 365d;
      add_header Cache-Control "public, immutable";
    }

    # Machine-readable corpora: plain text, short-lived cache.
    location ~ ^(/dev)?/llms(-full)?\.txt$ {
      default_type text/plain;
      add_header Cache-Control "public, max-age=3600";
    }

    # VitePress cleanUrls: /admin/orders is served from /admin/orders.html.
    location / {
      try_files $uri $uri.html $uri/index.html =404;
      add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    error_page 404 /404.html;

    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}
